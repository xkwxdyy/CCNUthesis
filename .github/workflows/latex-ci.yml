name: LaTeX checks

on:
  push:
    paths:
      - 'source/**'
      - 'test/**'
      - 'docs/**'
      - 'assets/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/latex-ci.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'test/**'
      - 'docs/**'
      - 'assets/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/latex-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate change fragments
        run: make check-changes
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: |
            latex latex-bin latexmk xetex biber ctex l3experimental
            amscls tools graphics psnfss xecjk filehook metafont xstring alphalph
            amsmath amsfonts mathtools biblatex biblatex-gb7714-2015 tex-gyre xits
            geometry fancyhdr footmisc bigfoot caption fontspec tikzpagenodes ifoddpage
            tabularray etoolbox accsupp oberdiek mwe zhlineskip enumitem tocloft newtx
            booktabs colortbl multirow xpinyin hologo csquotes fancyvrb underscore hypdoc
            libertinus-fonts plex-otf unicode-math hyperref listings makecell siunitx
            threeparttable pgf
            xcolor xcolor-material xunicode zref
      - name: Compile test fixtures
        run: bash scripts/test.sh --parallel --verbose --report --report-format markdown
      - name: Build user guide
        run: make docs
